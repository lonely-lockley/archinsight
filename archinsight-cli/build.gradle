plugins {
    id 'base'
}

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def generatedVersionFile = file('src/version.ts')

tasks.register('generateVersion') {
    group = 'build'
    description = 'Generates CLI version metadata from the Gradle project version.'
    inputs.property('version', project.version.toString())
    outputs.file(generatedVersionFile)
    doLast {
        generatedVersionFile.parentFile.mkdirs()
        generatedVersionFile.text = "export const version = \"${project.version}\";\n"
    }
}

tasks.register('npmInstall', Exec) {
    group = 'build'
    description = 'Installs CLI dependencies.'
    dependsOn rootProject.tasks.named('syncPackageVersions')
    inputs.file('package.json')
    if (file('package-lock.json').exists()) {
        inputs.file('package-lock.json')
    }
    outputs.dir('node_modules')
    workingDir = projectDir
    commandLine npmCommand, 'install'
}

tasks.register('npmBuild', Exec) {
    group = 'build'
    description = 'Builds the Archinsight CLI.'
    dependsOn 'npmInstall', 'generateVersion', rootProject.tasks.named('generateLanguageSources')
    inputs.dir('src')
    inputs.dir('../packages/insight-language/src')
    outputs.dir('build')
    workingDir = projectDir
    environment 'ARCHINSIGHT_LANGUAGE_SOURCES_READY', 'true'
    environment 'ARCHINSIGHT_CLI_VERSION', project.version.toString()
    commandLine npmCommand, 'run', 'build'
}

tasks.register('npmPack', Exec) {
    group = 'build'
    description = 'Creates the Archinsight CLI npm tarball under dist/.'
    dependsOn 'npmBuild', rootProject.tasks.named('copyLicenses')
    inputs.file('package.json')
    inputs.file('README.md')
    inputs.file('LICENSE')
    inputs.dir('build')
    outputs.dir('dist')
    workingDir = projectDir
    doFirst {
        file('dist').mkdirs()
    }
    commandLine npmCommand, 'pack', '--pack-destination', 'dist'
}

tasks.register('npmPackDryRun', Exec) {
    group = 'verification'
    description = 'Runs npm pack --dry-run for the Archinsight CLI package.'
    dependsOn 'npmBuild', rootProject.tasks.named('copyLicenses')
    inputs.file('package.json')
    inputs.file('README.md')
    inputs.file('LICENSE')
    inputs.dir('build')
    workingDir = projectDir
    commandLine npmCommand, 'pack', '--dry-run'
}

tasks.named('npmPack') {
    mustRunAfter 'npmPackDryRun'
}

tasks.register('npmCheck') {
    group = 'verification'
    description = 'Runs CLI checks.'
    dependsOn 'npmBuild'
    doLast {
        providers.exec {
            workingDir projectDir
            commandLine npmCommand, 'run', 'test:skill'
        }.result.get()
    }
}

tasks.named('assemble') {
    dependsOn 'npmBuild'
}

tasks.register('dist') {
    group = 'build'
    description = 'Builds the CLI distribution tarball.'
    dependsOn 'npmPack'
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Synchronizes metadata, checks, dry-packs, and builds the CLI release tarball.'
    dependsOn rootProject.tasks.named('syncPackageVersions'), 'npmCheck', 'npmPackDryRun', 'npmPack'
}

tasks.named('check') {
    dependsOn 'npmCheck'
}
