plugins {
    id 'base'
}

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def imageRepository = providers.gradleProperty('archinsightImageRepository').getOrElse('lonelylockley/archinsight')
def releaseImage = "${imageRepository}:editor-ui-${project.version}"
def releaseContextRoot = providers.gradleProperty('archinsightContextRoot').getOrElse('/app')
def releasePlatforms = providers.gradleProperty('archinsightDockerPlatforms').getOrElse('linux/amd64')

tasks.register('npmInstall', Exec) {
    group = 'build'
    description = 'Installs web dependencies.'
    dependsOn rootProject.tasks.named('syncPackageVersions')
    workingDir = projectDir
    commandLine npmCommand, 'install'
}

tasks.register('svelteKitSync', Exec) {
    group = 'build'
    description = 'Generates SvelteKit metadata required by TypeScript consumers.'
    dependsOn 'npmInstall'
    inputs.file('svelte.config.js')
    inputs.file('tsconfig.json')
    outputs.file('.svelte-kit/tsconfig.json')
    workingDir = projectDir
    commandLine npmCommand, 'exec', 'svelte-kit', 'sync'
}

tasks.register('npmBuild', Exec) {
    group = 'build'
    description = 'Builds the SvelteKit web app.'
    dependsOn 'npmInstall', 'svelteKitSync', rootProject.tasks.named('generateLanguageSources')
    inputs.property('archinsightContextRoot', releaseContextRoot)
    workingDir = projectDir
    environment 'ARCHINSIGHT_LANGUAGE_SOURCES_READY', 'true'
    environment 'ARCHINSIGHT_CONTEXT_ROOT', releaseContextRoot
    commandLine npmCommand, 'run', 'build'
}

tasks.register('npmCheck', Exec) {
    group = 'verification'
    description = 'Runs web type checks.'
    dependsOn 'npmInstall', 'svelteKitSync', rootProject.tasks.named('generateLanguageSources')
    workingDir = projectDir
    environment 'ARCHINSIGHT_LANGUAGE_SOURCES_READY', 'true'
    commandLine npmCommand, 'run', 'check'
}

tasks.register('npmTestSecurity', Exec) {
    group = 'verification'
    description = 'Runs web SVG sanitizer/security tests.'
    dependsOn 'npmInstall', rootProject.tasks.named('generateLanguageSources')
    workingDir = projectDir
    commandLine npmCommand, 'run', 'test:security'
}

tasks.register('npmTestServer', Exec) {
    group = 'verification'
    description = 'Runs web server/API tests.'
    dependsOn 'npmInstall', rootProject.tasks.named('generateLanguageSources')
    workingDir = projectDir
    environment 'ARCHINSIGHT_LANGUAGE_SOURCES_READY', 'true'
    commandLine npmCommand, 'run', 'test:server'
}

tasks.named('assemble') {
    dependsOn 'npmBuild'
}

tasks.register('dockerBuild', Exec) {
    group = 'build'
    description = "Builds the Archinsight web container image ${releaseImage}."
    dependsOn 'npmBuild'
    workingDir = rootProject.projectDir
    commandLine 'docker', 'build',
        '--file', 'archinsight-web/Dockerfile',
        '--tag', releaseImage,
        '--build-arg', "ARCHINSIGHT_CONTEXT_ROOT=${releaseContextRoot}",
        '.'
}

tasks.register('dockerPush', Exec) {
    group = 'publishing'
    description = "Builds and publishes the multi-platform Archinsight web image ${releaseImage}."
    dependsOn 'npmBuild'
    workingDir = rootProject.projectDir
    commandLine 'docker', 'buildx', 'build',
        '--platform', releasePlatforms,
        '--file', 'archinsight-web/Dockerfile',
        '--tag', releaseImage,
        '--build-arg', "ARCHINSIGHT_CONTEXT_ROOT=${releaseContextRoot}",
        '--push',
        '.'
}

tasks.register('dist') {
    group = 'build'
    description = 'Builds the web distribution and release container image.'
    dependsOn 'npmBuild', 'dockerBuild'
}

tasks.named('check') {
    dependsOn 'npmCheck', 'npmTestSecurity', 'npmTestServer'
}
