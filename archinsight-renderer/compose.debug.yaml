services:
  archinsight-renderer:
    build:
      context: ..
      dockerfile: archinsight-renderer/Dockerfile
    image: archinsight-renderer:dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      RENDERER_API_TOKEN: "archinsight-local-renderer-token"
      MAX_BODY_BYTES: "1048576"
      BODY_TIMEOUT_MS: "5000"
      MAX_RENDER_COUNT: "16"
      MAX_DOT_BYTES: "1048576"
      MAX_TOTAL_DOT_BYTES: "1048576"
      DEFAULT_PNG_DPI: "200"
      MAX_PNG_DPI: "600"
      MAX_PNG_BYTES: "8388608"
      MAX_PNG_WIDTH: "8192"
      MAX_PNG_HEIGHT: "8192"
      MAX_PNG_PIXELS: "16777216"
      MAX_SVG_BYTES: "2097152"
      MAX_TOTAL_OUTPUT_BYTES: "12582912"
      MAX_RESPONSE_BYTES: "16777216"
      MAX_WARNING_BYTES: "65536"
      RENDER_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_RENDERS: "2"
      MAX_QUEUED_RENDERS: "16"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
