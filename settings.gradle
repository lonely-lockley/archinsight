pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'insight'

gradle.ext.archinsightVersions = [
    contracts: '3.1.1',
    editorSupport: '3.1.1',
    graphviz : '3.1.1',
    language: '3.1.1',
    workbench: '3.1.1',
    web     : '3.1.1',
    renderer: '3.1.1',
    cli     : '3.1.1',
    vscode  : '3.1.1'
]

include 'archinsight-web'
include 'archinsight-renderer'
include 'archinsight-cli'
include 'archinsight-vscode'
