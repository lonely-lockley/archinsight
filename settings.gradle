pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'insight'

gradle.ext.archinsightVersions = [
    language: '3.0.2',
    web     : '3.0.2',
    renderer: '3.0.2',
    cli     : '3.0.2',
    vscode  : '3.0.9'
]

include 'archinsight-web'
include 'archinsight-renderer'
include 'archinsight-cli'
include 'archinsight-vscode'
